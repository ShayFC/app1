<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Smart Pantry & Meal Planner</title>
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#059669">
    <style>
        /* --- DESIGN SYSTEM & CSS VARIABLES --- */
        :root {
            --primary: #059669;
            --primary-light: #10B981;
            --primary-subtle: #ECFDF5;
            --accent: #3B82F6;
            --warning: #F59E0B;
            --warning-subtle: #FFFBEB;
            --danger: #EF4444;
            --danger-subtle: #FEF2F2;
            --bg: #F8FAFC;
            --card-bg: #FFFFFF;
            --text-main: #0F172A;
            --text-muted: #64748B;
            --border: #E2E8F0;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.08), 0 2px 4px -1px rgba(0, 0, 0, 0.04);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.08), 0 4px 6px -2px rgba(0, 0, 0, 0.03);
            --radius-sm: 8px;
            --radius-md: 14px;
            --radius-lg: 20px;
            --nav-height: 70px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg); color: var(--text-main); padding-bottom: calc(var(--nav-height) + 24px); line-height: 1.5; }

        /* Header */
        header { 
            background: rgba(255, 255, 255, 0.85); 
            backdrop-filter: blur(12px); 
            -webkit-backdrop-filter: blur(12px);
            color: var(--text-main); 
            padding: 16px 20px; 
            position: sticky; 
            top: 0; 
            z-index: 10; 
            border-bottom: 1px solid var(--border);
        }
        header h2 { font-size: 1.35rem; font-weight: 700; letter-spacing: -0.02em; }
        .icon-btn-ghost { background: transparent; border: none; font-size: 1.3rem; padding: 8px; border-radius: 50%; color: var(--text-muted); cursor: pointer; transition: background 0.2s; }
        .icon-btn-ghost:active { background: var(--border); }

        /* Layout & Container */
        .container { padding: 20px 16px; max-width: 640px; margin: 0 auto; }
        .section-title { font-size: 1.1rem; font-weight: 700; color: var(--text-main); margin: 24px 0 12px 0; display: flex; align-items: center; justify-content: space-between; }
        .section-title:first-child { margin-top: 0; }

        /* Cards */
        .card { 
            background: var(--card-bg); 
            border-radius: var(--radius-md); 
            padding: 16px; 
            margin-bottom: 12px; 
            box-shadow: var(--shadow-sm); 
            border: 1px solid var(--border); 
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }
        .card:active { transform: scale(0.995); }
        .card.low-stock { border-left: 4px solid var(--warning); }
        .card-title { font-size: 1rem; font-weight: 600; color: var(--text-main); }
        .card-subtitle { font-size: 0.85rem; color: var(--text-muted); margin-top: 2px; }

        /* Badges */
        .badge { padding: 4px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: 600; display: inline-flex; align-items: center; gap: 4px; }
        .badge-green { background: var(--primary-subtle); color: var(--primary); }
        .badge-orange { background: var(--warning-subtle); color: var(--warning); }
        .badge-red { background: var(--danger-subtle); color: var(--danger); }

        /* Utility Flex */
        .flex { display: flex; align-items: center; }
        .flex-between { display: flex; justify-content: space-between; align-items: center; }
        .gap-2 { gap: 8px; }
        .gap-3 { gap: 12px; }

        /* Buttons & Inputs */
        button { border: none; background: none; cursor: pointer; font-weight: 600; border-radius: var(--radius-sm); transition: all 0.2s; }
        .btn-primary { background: var(--primary); color: white; padding: 14px 20px; font-size: 1rem; width: 100%; min-height: 48px; border-radius: var(--radius-md); box-shadow: 0 2px 4px rgba(5, 150, 105, 0.2); }
        .btn-primary:active { background: #047857; }
        .btn-secondary { background: var(--bg); color: var(--text-main); border: 1px solid var(--border); padding: 10px 16px; min-height: 44px; border-radius: var(--radius-sm); }
        .btn-secondary:active { background: var(--border); }
        .btn-icon { width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; background: var(--bg); border: 1px solid var(--border); border-radius: 50%; font-size: 1.1rem; color: var(--text-main); }
        .btn-icon:active { background: var(--border); }
        .btn-danger { background: var(--danger-subtle); color: var(--danger); padding: 10px 16px; border-radius: var(--radius-sm); }
        
        input, select { 
            width: 100%; 
            padding: 12px 14px; 
            border: 1px solid var(--border); 
            border-radius: var(--radius-sm); 
            font-size: 0.95rem; 
            background: var(--bg);
            color: var(--text-main);
            margin-bottom: 12px; 
            outline: none;
            transition: border-color 0.2s, background 0.2s;
        }
        input:focus, select:focus { border-color: var(--primary); background: #fff; }

        /* Navigation Bar */
        #bottom-nav { 
            position: fixed; 
            bottom: 0; 
            left: 0; 
            right: 0; 
            height: var(--nav-height); 
            background: rgba(255, 255, 255, 0.9); 
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-top: 1px solid var(--border); 
            display: flex; 
            justify-content: space-around; 
            align-items: center; 
            z-index: 100; 
            max-width: 640px; 
            margin: 0 auto; 
        }
        .nav-item { 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            color: var(--text-muted); 
            font-size: 0.72rem; 
            font-weight: 500;
            min-width: 56px; 
            padding: 6px 0; 
            cursor: pointer;
            transition: color 0.2s;
        }
        .nav-item .icon { font-size: 1.4rem; margin-bottom: 2px; transition: transform 0.2s; }
        .nav-item.active { color: var(--primary); font-weight: 700; }
        .nav-item.active .icon { transform: translateY(-2px); }

        /* Tab Groups & Category Pills */
        .pill-container { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 16px; scrollbar-width: none; }
        .pill-container::-webkit-scrollbar { display: none; }
        .pill { padding: 8px 16px; background: var(--card-bg); border: 1px solid var(--border); border-radius: 20px; white-space: nowrap; font-size: 0.85rem; font-weight: 600; color: var(--text-muted); cursor: pointer; }
        .pill.active { background: var(--primary); color: white; border-color: var(--primary); box-shadow: 0 2px 4px rgba(5, 150, 105, 0.2); }

        .tab-group { display: flex; background: #E2E8F0; padding: 3px; border-radius: var(--radius-md); margin-bottom: 20px; }
        .tab { flex: 1; text-align: center; padding: 8px 12px; font-size: 0.88rem; font-weight: 600; color: var(--text-muted); border-radius: 11px; cursor: pointer; transition: all 0.2s; }
        .tab.active { background: var(--card-bg); color: var(--text-main); box-shadow: var(--shadow-sm); }

        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        
        /* Modals */
        .modal-overlay { 
            position: fixed; 
            top: 0; left: 0; right: 0; bottom: 0; 
            background: rgba(15, 23, 42, 0.4); 
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            display: none; 
            justify-content: center; 
            align-items: flex-end; 
            z-index: 1000; 
        }
        @media(min-width: 640px) { .modal-overlay { align-items: center; } }
        .modal { 
            background: white; 
            padding: 24px; 
            border-top-left-radius: var(--radius-lg); 
            border-top-right-radius: var(--radius-lg); 
            width: 100%; 
            max-width: 500px; 
            max-height: 85vh; 
            overflow-y: auto; 
            box-shadow: var(--shadow-lg);
            animation: slideUp 0.25s ease-out;
        }
        @media(min-width: 640px) { .modal { border-radius: var(--radius-lg); } }

        @keyframes slideUp {
            from { transform: translateY(100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        
        /* Views */
        .view { display: none; }
        .view.active { display: block; }

        .qty-controls { display: flex; align-items: center; gap: 10px; background: var(--bg); padding: 4px; border-radius: 20px; border: 1px solid var(--border); }
        .qty-controls span { min-width: 36px; text-align: center; font-weight: 700; font-size: 0.9rem; }
    </style>
</head>
<body>

    <header class="flex-between">
        <h2 id="header-title">What Can I Make?</h2>
        <button class="icon-btn-ghost" onclick="openSettings()" aria-label="Settings">⚙️</button>
    </header>

    <div id="app-content" class="container">
        <!-- View: HOME (What can I make?) -->
        <div id="view-home" class="view active">
            <div class="pill-container" id="home-category-pills"></div>
            <div class="tab-group">
                <div class="tab active" onclick="setHomeTab('ready')" id="tab-ready">Ready to Make</div>
                <div class="tab" onclick="setHomeTab('almost')" id="tab-almost">Almost Ready</div>
            </div>
            <div id="home-recipe-list"></div>
        </div>

        <!-- View: PANTRY -->
        <div id="view-pantry" class="view">
            <button class="btn-primary" onclick="openPantryModal()" style="margin-bottom: 20px;">+ Add Pantry Item</button>
            <div class="section-title">Food Items</div>
            <div id="pantry-food-list"></div>
            <div class="section-title">Household Items</div>
            <div id="pantry-household-list"></div>
        </div>

        <!-- View: RECIPES -->
        <div id="view-recipes" class="view">
            <div id="recipe-list"></div>
        </div>

        <!-- View: PLANNER -->
        <div id="view-planner" class="view">
            <button class="btn-primary" onclick="generateShoppingList()" style="margin-bottom: 20px;">🛒 Generate Shopping List</button>
            <div id="planner-grid"></div>
        </div>

        <!-- View: SHOPPING -->
        <div id="view-shopping" class="view">
            <div class="flex gap-2" style="margin-bottom: 20px;">
                <input type="text" id="manual-shop-item" placeholder="Add manual item (e.g. Paper towels)..." style="margin-bottom:0; flex:1;">
                <button class="btn-secondary" onclick="addManualShopItem()" style="height:46px;">Add</button>
            </div>
            <div id="shopping-categories"></div>
        </div>
    </div>

    <!-- Bottom Navigation -->
    <nav id="bottom-nav">
        <div class="nav-item active" onclick="switchView('home')"><span class="icon">🏠</span>Home</div>
        <div class="nav-item" onclick="switchView('pantry')"><span class="icon">🥫</span>Pantry</div>
        <div class="nav-item" onclick="switchView('recipes')"><span class="icon">📖</span>Recipes</div>
        <div class="nav-item" onclick="switchView('planner')"><span class="icon">📅</span>Planner</div>
        <div class="nav-item" onclick="switchView('shopping')"><span class="icon">🛒</span>List</div>
    </nav>

    <!-- Modal: Settings -->
    <div id="modal-settings" class="modal-overlay">
        <div class="modal">
            <div class="flex-between" style="margin-bottom: 16px;">
                <h2 style="font-size:1.2rem;">Settings</h2>
                <button onclick="closeModals()" class="icon-btn-ghost">✕</button>
            </div>
            <p class="card-subtitle" style="margin-bottom: 20px;">Manage your offline app data.</p>
            <button class="btn-secondary" onclick="exportData()" style="width:100%; margin-bottom:12px;">📤 Export Data (JSON)</button>
            <label class="btn-secondary" style="display:block; text-align:center; width:100%; margin-bottom:12px; cursor:pointer;">
                📥 Import Data (JSON)
                <input type="file" id="import-file" accept=".json" style="display:none;" onchange="importData(event)">
            </label>
            <button class="btn-danger" onclick="resetData()" style="width:100%; margin-bottom:16px;">⚠️ Reset to Default Data</button>
            <button class="btn-primary" onclick="closeModals()">Done</button>
        </div>
    </div>

    <!-- Modal: Pantry Item Add/Edit -->
    <div id="modal-pantry" class="modal-overlay">
        <div class="modal">
            <div class="flex-between" style="margin-bottom: 16px;">
                <h2 id="pantry-modal-title" style="font-size:1.2rem;">Add Item</h2>
                <button onclick="closeModals()" class="icon-btn-ghost">✕</button>
            </div>
            <label class="card-subtitle">Item Name</label>
            <input type="text" id="pi-name" placeholder="e.g. Tomato">
            
            <div class="grid-2">
                <div>
                    <label class="card-subtitle">Quantity</label>
                    <input type="number" id="pi-qty" placeholder="0">
                </div>
                <div>
                    <label class="card-subtitle">Unit</label>
                    <select id="pi-unit">
                        <optgroup label="Weight"> <option value="g">g</option> <option value="kg">kg</option> <option value="oz">oz</option> <option value="lbs">lbs</option> </optgroup>
                        <optgroup label="Volume"> <option value="ml">ml</option> <option value="L">L</option> <option value="tsp">tsp</option> <option value="tbsp">tbsp</option> <option value="cup">cup</option> </optgroup>
                        <optgroup label="Count"> <option value="pcs">pcs</option> <option value="units">units</option> <option value="cans">cans</option> <option value="slices">slices</option> </optgroup>
                    </select>
                </div>
            </div>
            <label class="card-subtitle">Low Stock Threshold</label>
            <input type="number" id="pi-threshold" placeholder="Alert when stock falls below this amount">
            
            <label class="card-subtitle">Category Type</label>
            <select id="pi-type">
                <option value="food">Food</option>
                <option value="household">Household</option>
            </select>
            
            <button class="btn-primary" onclick="savePantryItem()" style="margin-top:8px; margin-bottom:8px;">Save Item</button>
            <button class="btn-secondary" onclick="closeModals()" style="width:100%;">Cancel</button>
        </div>
    </div>

    <!-- Modal: Recipe Detail -->
    <div id="modal-recipe" class="modal-overlay">
        <div class="modal" id="recipe-modal-content"></div>
    </div>

    <!-- Modal: Planner Selection -->
    <div id="modal-planner" class="modal-overlay">
        <div class="modal">
            <div class="flex-between" style="margin-bottom: 12px;">
                <h2 style="font-size:1.2rem;">Select Meal</h2>
                <button onclick="closeModals()" class="icon-btn-ghost">✕</button>
            </div>
            <p id="planner-slot-title" class="card-subtitle" style="margin-bottom:16px;"></p>
            
            <label class="card-subtitle">Recipe</label>
            <select id="planner-recipe-select"></select>
            
            <label class="card-subtitle">Servings</label>
            <input type="number" id="planner-servings" min="1" value="2" placeholder="Servings">
            
            <button class="btn-primary" onclick="saveMealSlot()" style="margin-bottom:8px;">Save Meal</button>
            <button class="btn-danger" onclick="clearMealSlot()" style="width:100%; margin-bottom:8px;">Clear Slot</button>
        </div>
    </div>

    <script>
        /** --- 1. CORE CONFIGURATION & NORMALIZATION ENGINE --- **/
        const UNITS = {
            g: { base: 'weight', factor: 1 }, kg: { base: 'weight', factor: 1000 }, oz: { base: 'weight', factor: 28.35 }, lbs: { base: 'weight', factor: 453.6 },
            ml: { base: 'volume', factor: 1 }, L: { base: 'volume', factor: 1000 }, tsp: { base: 'volume', factor: 5 }, tbsp: { base: 'volume', factor: 15 }, cup: { base: 'volume', factor: 240 },
            pcs: { base: 'count', factor: 1 }, eggs: { base: 'count', factor: 1 }, units: { base: 'count', factor: 1 }, cans: { base: 'count', factor: 1 }, slices: { base: 'count', factor: 1 }
        };

        const CATEGORIES = {
            'produce': ['tomato', 'onion', 'garlic', 'apple', 'banana', 'lettuce', 'potato'],
            'dairy & chilled': ['milk', 'cheese', 'egg', 'eggs', 'butter', 'yogurt'],
            'meat & seafood': ['chicken breast', 'beef', 'salmon', 'bacon'],
            'pantry & dry goods': ['pasta', 'rice', 'flour', 'sugar', 'salt', 'pepper', 'olive oil']
        };

        function toBase(qty, unit) { return qty * (UNITS[unit]?.factor || 1); }
        function fromBase(qty, unit) { return qty / (UNITS[unit]?.factor || 1); }
        function getCategory(itemName) {
            const name = itemName.toLowerCase();
            for (const [cat, items] of Object.entries(CATEGORIES)) {
                if (items.some(i => name.includes(i))) return cat;
            }
            return 'pantry & dry goods';
        }
        function round(num) { return Math.round(num * 10) / 10; }

        /** --- 2. STATE MANAGEMENT & INITIAL DATA --- **/
        let state = { pantry: [], recipes: [], mealPlan: {}, shoppingList: [] };
        
        const DEFAULT_DATA = {
            pantry: [
                { id: 1, name: 'Pasta', quantity: 200, unit: 'g', lowStockThreshold: 500, type: 'food' },
                { id: 2, name: 'Tomato', quantity: 6, unit: 'pcs', lowStockThreshold: 2, type: 'food' },
                { id: 3, name: 'Eggs', quantity: 4, unit: 'pcs', lowStockThreshold: 6, type: 'food' },
                { id: 4, name: 'Milk', quantity: 0.5, unit: 'L', lowStockThreshold: 1, type: 'food' },
                { id: 5, name: 'Flour', quantity: 1, unit: 'kg', lowStockThreshold: 0.5, type: 'food' },
                { id: 6, name: 'Chicken Breast', quantity: 600, unit: 'g', lowStockThreshold: 500, type: 'food' },
                { id: 7, name: 'Paper Towels', quantity: 1, unit: 'units', type: 'household' },
                { id: 8, name: 'Dish Soap', quantity: 0, unit: 'units', type: 'household' }
            ],
            recipes: [
                { id: 1, name: 'Tomato Pasta', tags: ['Dinner'], steps: ['Boil pasta in salted water', 'Chop tomatoes', 'Mix and cook for 10 mins'], ingredients: [ {name: 'Pasta', quantity: 150, unit: 'g'}, {name: 'Tomato', quantity: 2, unit: 'pcs'} ] },
                { id: 2, name: 'Omelette', tags: ['Breakfast'], steps: ['Whisk eggs with a splash of milk', 'Fry in pan over medium heat'], ingredients: [ {name: 'Eggs', quantity: 3, unit: 'pcs'}, {name: 'Milk', quantity: 30, unit: 'ml'} ] },
                { id: 3, name: 'Pancakes', tags: ['Breakfast', 'Dessert'], steps: ['Mix flour, milk, eggs until smooth', 'Fry on hot griddle'], ingredients: [ {name: 'Flour', quantity: 100, unit: 'g'}, {name: 'Milk', quantity: 150, unit: 'ml'}, {name: 'Eggs', quantity: 1, unit: 'pcs'} ] },
                { id: 4, name: 'Chicken Salad', tags: ['Lunch'], steps: ['Grill chicken until cooked through', 'Chop veggies', 'Toss together with dressing'], ingredients: [ {name: 'Chicken Breast', quantity: 200, unit: 'g'}, {name: 'Tomato', quantity: 1, unit: 'pcs'} ] },
                { id: 5, name: 'Scrambled Eggs', tags: ['Breakfast'], steps: ['Scramble eggs over low heat until fluffy'], ingredients: [ {name: 'Eggs', quantity: 2, unit: 'pcs'} ] }
            ],
            mealPlan: {},
            shoppingList: []
        };

        function loadState() {
            const saved = localStorage.getItem('smart_pantry_data');
            if (saved) state = JSON.parse(saved);
            else { state = JSON.parse(JSON.stringify(DEFAULT_DATA)); saveState(); }
        }
        function saveState() { localStorage.setItem('smart_pantry_data', JSON.stringify(state)); renderCurrentView(); }
        function generateId() { return Date.now(); }

        /** --- 3. UI NAVIGATION --- **/
        let currentView = 'home';
        let homeTab = 'ready';
        let activeHomeCategory = 'All';

        function switchView(view) {
            currentView = view;
            document.querySelectorAll('.view').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            document.getElementById(`view-${view}`).classList.add('active');
            
            const navItems = document.querySelectorAll('.nav-item');
            const viewIndex = ['home', 'pantry', 'recipes', 'planner', 'shopping'].indexOf(view);
            if(viewIndex > -1) navItems[viewIndex].classList.add('active');

            const titles = { home: 'What Can I Make?', pantry: 'Smart Pantry Stock', recipes: 'Recipe Book', planner: 'Weekly Planner', shopping: 'Shopping List' };
            document.getElementById('header-title').innerText = titles[view];
            renderCurrentView();
        }

        function renderCurrentView() {
            if(currentView === 'home') renderHome();
            if(currentView === 'pantry') renderPantry();
            if(currentView === 'recipes') renderRecipes();
            if(currentView === 'planner') renderPlanner();
            if(currentView === 'shopping') renderShoppingList();
        }

        /** --- 4. ENGINE: MATCHING & COOKING --- **/
        function getRecipeMatch(recipe, multiplier = 1) {
            let missing = [];
            recipe.ingredients.forEach(ing => {
                let reqBase = toBase(ing.quantity * multiplier, ing.unit);
                let pItem = state.pantry.find(p => p.name.toLowerCase() === ing.name.toLowerCase() && p.type === 'food');
                
                if (!pItem) {
                    missing.push({ name: ing.name, req: reqBase, missingBase: reqBase, displayUnit: ing.unit });
                } else {
                    let pBase = toBase(pItem.quantity, pItem.unit);
                    if (pBase < reqBase) {
                        missing.push({ name: ing.name, req: reqBase, missingBase: reqBase - pBase, displayUnit: ing.unit });
                    }
                }
            });
            return missing;
        }

        function cookRecipe(recipeId, servings) {
            if(!confirm(`Cook this recipe for ${servings} serving(s)? This will deduct ingredients from your pantry.`)) return;
            const recipe = state.recipes.find(r => r.id == recipeId);
            const missing = getRecipeMatch(recipe, servings);
            if(missing.length > 0) {
                if(!confirm(`You are missing ${missing.length} ingredient(s). Deduct available items anyway?`)) return;
            }

            recipe.ingredients.forEach(ing => {
                let reqBase = toBase(ing.quantity * servings, ing.unit);
                let pItem = state.pantry.find(p => p.name.toLowerCase() === ing.name.toLowerCase());
                if(pItem) {
                    let pBase = toBase(pItem.quantity, pItem.unit);
                    let newBase = Math.max(0, pBase - reqBase);
                    pItem.quantity = round(fromBase(newBase, pItem.unit));
                }
            });
            closeModals();
            saveState();
            alert('Ingredients deducted from pantry!');
        }

        /** --- 5. VIEW RENDERERS --- **/
        
        /* HOME VIEW */
        function setHomeTab(tab) {
            homeTab = tab;
            document.querySelectorAll('.tab').forEach(el => el.classList.remove('active'));
            document.getElementById(`tab-${tab}`).classList.add('active');
            renderHome();
        }
        function setHomeCategory(cat) { activeHomeCategory = cat; renderHome(); }

        function renderHome() {
            const tags = ['All', 'Breakfast', 'Lunch', 'Dinner', 'Dessert'];
            const pillHTML = tags.map(t => `<div class="pill ${activeHomeCategory === t ? 'active' : ''}" onclick="setHomeCategory('${t}')">${t}</div>`).join('');
            document.getElementById('home-category-pills').innerHTML = pillHTML;

            const list = document.getElementById('home-recipe-list');
            list.innerHTML = '';

            state.recipes.forEach(r => {
                if(activeHomeCategory !== 'All' && !r.tags.includes(activeHomeCategory)) return;
                
                const missing = getRecipeMatch(r, 1);
                const missingCount = missing.length;
                
                if(homeTab === 'ready' && missingCount > 0) return;
                if(homeTab === 'almost' && (missingCount === 0 || missingCount > 2)) return;

                let badgeHtml = missingCount === 0 ? `<span class="badge badge-green">✓ Ready to Cook</span>` : 
                    `<span class="badge badge-orange">Missing ${missingCount}: ${missing.map(m => m.name).join(', ')}</span>`;

                list.innerHTML += `
                    <div class="card" onclick="openRecipeModal(${r.id})">
                        <div class="flex-between" style="margin-bottom:6px;">
                            <div class="card-title">${r.name}</div>
                            ${badgeHtml}
                        </div>
                        <div class="card-subtitle">${r.tags.join(' • ')} — ${r.ingredients.length} Ingredients</div>
                    </div>`;
            });
            if(list.innerHTML === '') list.innerHTML = `<p class="card-subtitle" style="text-align:center; padding: 24px 0;">No recipes match this filter.</p>`;
        }

        /* PANTRY VIEW */
        function renderPantry() {
            const fList = document.getElementById('pantry-food-list');
            const hList = document.getElementById('pantry-household-list');
            fList.innerHTML = ''; hList.innerHTML = '';

            state.pantry.forEach(item => {
                if(item.type === 'food') {
                    const isLow = item.quantity <= item.lowStockThreshold;
                    fList.innerHTML += `
                        <div class="card flex-between ${isLow ? 'low-stock' : ''}">
                            <div>
                                <div class="card-title" onclick="editPantryItem(${item.id})">${item.name} <span style="font-size:0.8rem; cursor:pointer; opacity:0.6;">✏️</span></div>
                                <div class="card-subtitle">${isLow ? `<span class="badge badge-orange">Low Stock</span> ` : ''}Alert below ${item.lowStockThreshold} ${item.unit}</div>
                            </div>
                            <div class="qty-controls">
                                <button class="btn-icon" onclick="adjustPantryQty(${item.id}, -1)">-</button>
                                <span>${item.quantity}<br><small style="font-size:0.65rem; color:var(--text-muted); font-weight:normal;">${item.unit}</small></span>
                                <button class="btn-icon" onclick="adjustPantryQty(${item.id}, 1)">+</button>
                            </div>
                        </div>`;
                } else {
                    const inStock = item.quantity > 0;
                    hList.innerHTML += `
                        <div class="card flex-between ${!inStock ? 'low-stock' : ''}">
                            <div>
                                <div class="card-title" onclick="editPantryItem(${item.id})">${item.name} <span style="font-size:0.8rem; cursor:pointer; opacity:0.6;">✏️</span></div>
                            </div>
                            <button class="badge ${inStock ? 'badge-green' : 'badge-red'}" style="border:none; padding:8px 14px; font-size:0.85rem; cursor:pointer;" onclick="toggleHousehold(${item.id})">
                                ${inStock ? '✓ In Stock' : '✕ Need More'}
                            </button>
                        </div>`;
                }
            });
        }

        function adjustPantryQty(id, direction) {
            let item = state.pantry.find(p => p.id === id);
            if(item) {
                let step = (item.unit === 'g' || item.unit === 'ml') ? 50 : (item.unit === 'kg' || item.unit === 'L') ? 0.25 : 1;
                item.quantity = Math.max(0, round(item.quantity + (direction * step)));
                saveState();
            }
        }
        function toggleHousehold(id) {
            let item = state.pantry.find(p => p.id === id);
            if(item) { item.quantity = item.quantity > 0 ? 0 : 1; saveState(); }
        }

        /* RECIPES VIEW */
        function renderRecipes() {
            const list = document.getElementById('recipe-list');
            list.innerHTML = '';
            state.recipes.forEach(r => {
                list.innerHTML += `
                    <div class="card flex-between" onclick="openRecipeModal(${r.id})">
                        <div>
                            <div class="card-title">${r.name}</div>
                            <div class="card-subtitle">${r.tags.join(' • ')}</div>
                        </div>
                        <span style="color:var(--text-muted); font-size:1.2rem;">➔</span>
                    </div>`;
            });
        }

        /* PLANNER VIEW */
        const DAYS = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'];
        const MEALS = ['Breakfast', 'Lunch', 'Dinner'];
        let activePlannerSlot = null;

        function renderPlanner() {
            const grid = document.getElementById('planner-grid');
            grid.innerHTML = '';
            DAYS.forEach(day => {
                let html = `<div style="margin-bottom: 20px;"><div class="section-title">${day}</div><div style="display:flex; gap:10px; overflow-x:auto; padding-bottom:4px;">`;
                MEALS.forEach(meal => {
                    let slotKey = `${day}-${meal}`;
                    let plan = state.mealPlan[slotKey];
                    let recipeName = plan ? state.recipes.find(r=>r.id==plan.recipeId)?.name : '+ Add Meal';
                    html += `
                        <div class="card" style="min-width:140px; margin-bottom:0; cursor:pointer; ${plan ? 'background: var(--primary-subtle); border-color: var(--primary-light);' : ''}" onclick="openPlannerModal('${day}', '${meal}')">
                            <div class="card-subtitle" style="${plan ? 'color: var(--primary); font-weight: 600;' : ''}">${meal}</div>
                            <div style="font-weight:700; margin-top:4px; font-size:0.95rem; color: ${plan ? 'var(--primary)' : 'var(--text-muted)'}">${recipeName}</div>
                            ${plan ? `<div class="card-subtitle" style="color:var(--primary); font-weight:500;">${plan.servings} serving(s)</div>` : ''}
                        </div>`;
                });
                html += `</div></div>`;
                grid.innerHTML += html;
            });
        }

        /* SHOPPING LIST VIEW */
        function generateShoppingList() {
            let neededBase = {};
            
            for (let key in state.mealPlan) {
                let plan = state.mealPlan[key];
                let recipe = state.recipes.find(r => r.id == plan.recipeId);
                if(recipe) {
                    recipe.ingredients.forEach(ing => {
                        let name = ing.name.toLowerCase();
                        let baseQty = toBase(ing.quantity * plan.servings, ing.unit);
                        if(!neededBase[name]) neededBase[name] = { qty: 0, refUnit: ing.unit };
                        neededBase[name].qty += baseQty;
                    });
                }
            }

            let deficits = [];
            for (let name in neededBase) {
                let pItem = state.pantry.find(p => p.name.toLowerCase() === name && p.type === 'food');
                let pBase = pItem ? toBase(pItem.quantity, pItem.unit) : 0;
                let needed = neededBase[name].qty;
                
                if (pBase < needed) {
                    let missingBase = needed - pBase;
                    let displayUnit = pItem ? pItem.unit : neededBase[name].refUnit;
                    let missingQty = round(fromBase(missingBase, displayUnit));
                    deficits.push({ id: generateId() + Math.random(), name: (pItem?.name || name), quantity: missingQty, unit: displayUnit, category: getCategory(name), isManual: false });
                }
            }

            state.pantry.filter(p => p.type === 'household' && p.quantity === 0).forEach(h => {
                deficits.push({ id: generateId() + Math.random(), name: h.name, quantity: 1, unit: 'units', category: 'household & toiletries', isManual: false });
            });

            let manualItems = state.shoppingList.filter(s => s.isManual);
            state.shoppingList = [...deficits, ...manualItems];
            
            saveState();
            switchView('shopping');
        }

        function addManualShopItem() {
            let input = document.getElementById('manual-shop-item');
            if(input.value.trim() === '') return;
            state.shoppingList.push({
                id: generateId(), name: input.value.trim(), quantity: 1, unit: 'units', category: 'household & toiletries', isManual: true
            });
            input.value = '';
            saveState();
        }

        function checkOffShoppingItem(id) {
            let idx = state.shoppingList.findIndex(s => s.id == id);
            if(idx > -1) {
                let item = state.shoppingList[idx];
                
                let pItem = state.pantry.find(p => p.name.toLowerCase() === item.name.toLowerCase());
                if(pItem) {
                    if(pItem.type === 'household') pItem.quantity = 1;
                    else {
                        let currentBase = toBase(pItem.quantity, pItem.unit);
                        let addBase = toBase(item.quantity, item.unit);
                        pItem.quantity = round(fromBase(currentBase + addBase, pItem.unit));
                    }
                } else if (item.isManual) {
                    state.pantry.push({ id: generateId(), name: item.name, quantity: 1, unit: 'units', type: 'household' });
                }

                state.shoppingList.splice(idx, 1);
                saveState();
            }
        }

        function renderShoppingList() {
            const container = document.getElementById('shopping-categories');
            container.innerHTML = '';
            if(state.shoppingList.length === 0) {
                container.innerHTML = `<div class="card" style="text-align:center; padding:32px 16px;"><p class="card-subtitle">Your shopping list is empty! Click "Generate Shopping List" in the Planner tab to fill it based on your meal plan.</p></div>`;
                return;
            }

            let groups = {};
            state.shoppingList.forEach(item => {
                let c = item.category.toUpperCase();
                if(!groups[c]) groups[c] = [];
                groups[c].push(item);
            });

            for(let cat in groups) {
                let html = `<div class="section-title">${cat}</div>`;
                groups[cat].forEach(item => {
                    html += `
                        <div class="card flex-between" style="padding:12px 16px;">
                            <div>
                                <div class="card-title">${item.name}</div>
                                <div class="card-subtitle">${item.isManual ? 'Manual Item' : `${item.quantity} ${item.unit}`}</div>
                            </div>
                            <button class="btn-icon" style="background: var(--primary-subtle); color: var(--primary); border-color: var(--primary-light);" onclick="checkOffShoppingItem(${item.id})">✓</button>
                        </div>`;
                });
                container.innerHTML += html;
            }
        }

        /** --- 6. MODAL HANDLERS --- **/
        function closeModals() { document.querySelectorAll('.modal-overlay').forEach(el => el.style.display = 'none'); }
        
        // Recipe Detail
        let currentRecipeScale = 1;
        function openRecipeModal(id) {
            let r = state.recipes.find(x => x.id === id);
            if(!r) return;
            currentRecipeScale = 1;
            
            const renderScale = () => {
                let ingHtml = r.ingredients.map(ing => {
                    return `<li style="padding:10px 0; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; font-size:0.95rem;"><span>${ing.name}</span><span style="font-weight:600; color:var(--text-muted);">${round(ing.quantity * currentRecipeScale)} ${ing.unit}</span></li>`;
                }).join('');
                let stepHtml = r.steps.map((s,i) => `<li style="margin-left:20px; margin-bottom:10px; font-size:0.95rem; color:var(--text-main);">${s}</li>`).join('');

                document.getElementById('recipe-modal-content').innerHTML = `
                    <div class="flex-between" style="margin-bottom:16px;">
                        <h2 style="font-size:1.3rem;">${r.name}</h2> 
                        <button onclick="closeModals()" class="icon-btn-ghost">✕</button>
                    </div>
                    <div style="background:var(--bg); padding:12px 16px; border-radius:var(--radius-sm); border:1px solid var(--border); margin-bottom:20px;" class="flex-between">
                        <span style="font-weight:600; font-size:0.9rem;">Servings</span>
                        <div class="qty-controls">
                            <button class="btn-icon" style="width:30px; height:30px;" onclick="updateScale(-1)">-</button>
                            <span id="scale-val">${currentRecipeScale}</span>
                            <button class="btn-icon" style="width:30px; height:30px;" onclick="updateScale(1)">+</button>
                        </div>
                    </div>
                    <div class="section-title">Ingredients</div>
                    <ul style="list-style:none; margin-bottom:20px;">${ingHtml}</ul>
                    <div class="section-title">Instructions</div>
                    <ol style="margin-bottom:24px;">${stepHtml}</ol>
                    <button class="btn-primary" onclick="cookRecipe(${r.id}, currentRecipeScale)">👨‍🍳 Cooked This (Deduct Pantry)</button>
                `;
            };
            
            window.updateScale = (dir) => { currentRecipeScale = Math.max(1, currentRecipeScale + dir); renderScale(); };
            renderScale();
            document.getElementById('modal-recipe').style.display = 'flex';
        }

        // Pantry Add/Edit
        let editingPantryId = null;
        function openPantryModal(id = null) {
            editingPantryId = id;
            document.getElementById('pantry-modal-title').innerText = id ? 'Edit Item' : 'Add Item';
            if(id) {
                let item = state.pantry.find(p => p.id === id);
                document.getElementById('pi-name').value = item.name;
                document.getElementById('pi-qty').value = item.quantity;
                document.getElementById('pi-unit').value = item.unit;
                document.getElementById('pi-threshold').value = item.lowStockThreshold || 0;
                document.getElementById('pi-type').value = item.type;
            } else {
                document.getElementById('pi-name').value = '';
                document.getElementById('pi-qty').value = '';
                document.getElementById('pi-unit').value = 'g';
                document.getElementById('pi-threshold').value = '0';
                document.getElementById('pi-type').value = 'food';
            }
            document.getElementById('modal-pantry').style.display = 'flex';
        }
        function savePantryItem() {
            let item = {
                id: editingPantryId || generateId(),
                name: document.getElementById('pi-name').value.trim(),
                quantity: parseFloat(document.getElementById('pi-qty').value) || 0,
                unit: document.getElementById('pi-unit').value,
                lowStockThreshold: parseFloat(document.getElementById('pi-threshold').value) || 0,
                type: document.getElementById('pi-type').value
            };
            if(!item.name) return alert('Name required');
            
            if(editingPantryId) {
                let idx = state.pantry.findIndex(p => p.id === editingPantryId);
                state.pantry[idx] = item;
            } else {
                state.pantry.push(item);
            }
            saveState();
            closeModals();
        }
        function editPantryItem(id) { openPantryModal(id); }

        // Planner Slot
        function openPlannerModal(day, meal) {
            activePlannerSlot = `${day}-${meal}`;
            document.getElementById('planner-slot-title').innerText = `${day} — ${meal}`;
            
            let select = document.getElementById('planner-recipe-select');
            select.innerHTML = `<option value="">-- Choose Recipe --</option>` + 
                state.recipes.map(r => `<option value="${r.id}">${r.name}</option>`).join('');
            
            let existing = state.mealPlan[activePlannerSlot];
            if(existing) {
                select.value = existing.recipeId;
                document.getElementById('planner-servings').value = existing.servings;
            } else {
                select.value = "";
                document.getElementById('planner-servings').value = 2;
            }
            document.getElementById('modal-planner').style.display = 'flex';
        }
        function saveMealSlot() {
            let rId = document.getElementById('planner-recipe-select').value;
            let serv = parseInt(document.getElementById('planner-servings').value) || 1;
            if(!rId) return alert('Select a recipe');
            state.mealPlan[activePlannerSlot] = { recipeId: rId, servings: serv };
            saveState();
            closeModals();
        }
        function clearMealSlot() {
            delete state.mealPlan[activePlannerSlot];
            saveState();
            closeModals();
        }

        // Settings
        function openSettings() { document.getElementById('modal-settings').style.display = 'flex'; }
        function exportData() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(state, null, 2));
            const dlAnchorElem = document.createElement('a');
            dlAnchorElem.setAttribute("href", dataStr);
            dlAnchorElem.setAttribute("download", "smart_pantry_backup.json");
            dlAnchorElem.click();
        }
        function importData(event) {
            const file = event.target.files[0];
            if(!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    let parsed = JSON.parse(e.target.result);
                    if(parsed.pantry && parsed.recipes) {
                        state = parsed;
                        saveState();
                        alert('Data imported successfully!');
                        closeModals();
                    } else alert('Invalid JSON structure.');
                } catch(err) { alert('Error reading file.'); }
            };
            reader.readAsText(file);
        }
        function resetData() {
            if(confirm("Are you sure? All custom recipes and pantry changes will be lost.")) {
                state = JSON.parse(JSON.stringify(DEFAULT_DATA));
                saveState();
                closeModals();
            }
        }

        /** --- 7. INIT & SERVICE WORKER --- **/
        window.onload = () => {
            loadState();
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register('./sw.js').catch(err => console.log('SW registration failed:', err));
            }
        };

    </script>
</body>
</html>
